# NequIP-LES smoke test, periodic (bulk water) -- eager.
# vectorized Ewald, no compilation.
#
# Full-term LES (uQiqiu): dipoles, quadrupoles, induced charges, induced dipoles
# with an anisotropic polarizability. Model and schedule are deliberately tiny --
# this checks that everything runs and that BEC inference works, not accuracy.
#
# One of the 12 configurations run by run_all.sh; the LES settings are
# written out explicitly rather than overridden on the command line.

run: [train, test]

cutoff_radius: 4.0
num_layers: 2
l_max: 1
num_features: 8

model_type_names: [H, O]
chemical_species: ${model_type_names}
monitored_metric: val0_epoch/weighted_sum

data:
  _target_: nequip.data.datamodule.ASEDataModule
  seed: 456
  split_dataset:
    - file_path: data/water_train.xyz
      train: 0.5
      val: 0.5
  # the BEC reference set: the test phase writes predicted BECs for it
  test_file_path: data/water_bec.xyz
  transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names: ${model_type_names}
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1
    num_workers: 0
    shuffle: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1
    num_workers: 0
  test_dataloader: ${data.val_dataloader}
  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    type_names: ${model_type_names}
    dataloader_kwargs:
      batch_size: 1

trainer:
  _target_: lightning.Trainer
  # CPU by default; run_all.sh overrides to gpu when CUDA is available. Not
  # "auto", which selects MPS on Macs, where NequIP's float64 buffers fail.
  accelerator: cpu
  enable_checkpointing: true
  max_epochs: 2
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: .
  callbacks:
    # index 0: run_all.sh overrides out_file so the 12 runs do not overwrite
    # each other. No file extension -- the writer appends it.
    - _target_: nequip.train.callbacks.TestTimeXYZFileWriter
      out_file: predictions/nequip_water_eager
      extra_fields: [LES_q, LES_BEC]         # predicted charges and BECs
      output_fields_from_original_dataset: [total_energy, forces]
      chemical_symbols: ${model_type_names}
    # turns BEC on for the test phase only, so `run: [train, test]` also
    # exercises BEC inference
    - _target_: nequip_les.train.callbacks.ToggleLESCallback
      compute_bec: true

training_module:
  _target_: nequip.train.EMALightningModule
  ema_decay: 0.999
  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0
  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      total_energy_mae: 1.0
      forces_mae: 1.0
  train_metrics: ${training_module.val_metrics}
  test_metrics: ${training_module.val_metrics}
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.005

  model:
    _target_: nequip_les.model.LESModel
    base_model: nequip
    compile_mode: eager

    LES:
      les_args:
        use_atomwise: false
        sigma: 1.0
        dl: 2.0
        remove_mean: true
        epsilon_factor: 1.0

        # every long-range term the module supports
        use_dipole: true
        use_quadrupole: true
        use_induced_charge: true
        use_induced_dipole: true
        use_anisotropic_polarizability: true
        alpha_irreps: "0e+1o"
        kappa_alpha_positive: true
        kappa_scale: 0.1
        alpha_scale: 0.1

        # vectorized (torch.compile-able) Ewald; run_all.sh sets this to null
        # for the legacy variant
        is_periodic: true
        N_max: 10

    seed: 456
    model_dtype: float32
    type_names: ${model_type_names}
    r_max: ${cutoff_radius}

    num_bessels: 8
    bessel_trainable: true
    polynomial_cutoff_p: 6

    num_layers: ${num_layers}
    l_max: ${l_max}
    parity: false
    num_features: ${num_features}

    radial_mlp_depth: 1
    radial_mlp_width: 16

    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}
    per_type_energy_scales: ${training_data_stats:per_type_forces_rms}
    per_type_energy_shifts: ${training_data_stats:per_atom_energy_mean}
    per_type_energy_scales_trainable: false
    per_type_energy_shifts_trainable: false

global_options:
  allow_tf32: false
